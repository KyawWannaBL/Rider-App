name: Rider Android signed build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "android/**"
      - "android-assets/photo-picker/**"
      - "scripts/configure-android-photo-picker.py"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.ts"
      - ".github/workflows/rider-android-release.yml"

permissions:
  contents: write

concurrency:
  group: rider-android-release
  cancel-in-progress: true

jobs:
  signed-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Initialize Android SDK from runner
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDK location: $SDK_ROOT"
          SDKMANAGER=""
          for candidate in "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager" "$SDK_ROOT/tools/bin/sdkmanager"; do
            if [ -x "$candidate" ]; then SDKMANAGER="$candidate"; break; fi
          done
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android SDK command-line tools not found on runner"
            exit 1
          fi
          echo "Using SDK manager: $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null || test "${PIPESTATUS[1]}" -eq 0
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "platform-tools" "platforms;android-35" "platforms;android-36" "build-tools;35.0.0"
          test -x "$SDK_ROOT/build-tools/35.0.0/apksigner"
          test -x "$SDK_ROOT/build-tools/35.0.0/aapt"
      - name: Require existing permanent Rider signing material
        env:
          RIDER_ANDROID_KEYSTORE_BASE64: ${{ secrets.RIDER_ANDROID_KEYSTORE_BASE64 }}
          RIDER_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.RIDER_ANDROID_KEYSTORE_PASSWORD }}
          RIDER_ANDROID_KEY_ALIAS: ${{ secrets.RIDER_ANDROID_KEY_ALIAS }}
          RIDER_ANDROID_KEY_PASSWORD: ${{ secrets.RIDER_ANDROID_KEY_PASSWORD }}
          RIDER_ANDROID_CERT_SHA256: ${{ secrets.RIDER_ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          for var in RIDER_ANDROID_KEYSTORE_BASE64 RIDER_ANDROID_KEYSTORE_PASSWORD RIDER_ANDROID_KEY_ALIAS RIDER_ANDROID_KEY_PASSWORD RIDER_ANDROID_CERT_SHA256; do
            if [ -z "${!var:-}" ]; then
              echo "::error::Missing permanent Rider signing secret: $var"
              exit 1
            fi
          done
      - name: Install Rider dependencies
        run: |
          npm ci --include=dev
          npm ls vite --depth=0
          test -x node_modules/.bin/vite
      - name: Verify and build Rider web application
        run: |
          set -euo pipefail
          npm run build
          # Vite copies public/** into dist/**. Exclude previously published APKs
          # from this Android package to prevent recursive release bundling.
          rm -rf dist/downloads
          test -s dist/index.html
          test -d dist/assets
          du -sh dist
          if [ "$(du -sm dist | cut -f1)" -gt 150 ]; then
            echo "::error::Rider web bundle exceeds 150 MB after excluding past APK downloads"
            exit 1
          fi
      - name: Initialize and synchronize native Android platform
        run: |
          set -euo pipefail
          # This repository has no checked-in native Android project.
          # Install matching Capacitor packages in the ephemeral CI workspace.
          npm install --no-save --package-lock=false @capacitor/cli@7.4.3 @capacitor/android@7.4.3
          if [ ! -f android/settings.gradle ] && [ ! -f android/settings.gradle.kts ]; then
            npx cap add android
          fi
          npx cap sync android
          test -f android/gradlew
          test -f android/app/build.gradle
          test -f android/app/src/main/AndroidManifest.xml
      - name: Configure native embedded and standard photo pickers
        run: python3 scripts/configure-android-photo-picker.py
      - name: Configure upgrade version
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          path=Path("android/app/build.gradle")
          data=path.read_text()
          code=400000+int(os.environ["BUILD_NUMBER"])
          data,n=re.subn(r"versionCode\s+\d+",f"versionCode {code}",data,count=1)
          if n!=1: raise SystemExit("Android versionCode missing")
          path.write_text(data)
          PY
      - name: Sign APK with retained Rider certificate
        env:
          RIDER_ANDROID_KEYSTORE_BASE64: ${{ secrets.RIDER_ANDROID_KEYSTORE_BASE64 }}
          RIDER_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.RIDER_ANDROID_KEYSTORE_PASSWORD }}
          RIDER_ANDROID_KEY_ALIAS: ${{ secrets.RIDER_ANDROID_KEY_ALIAS }}
          RIDER_ANDROID_KEY_PASSWORD: ${{ secrets.RIDER_ANDROID_KEY_PASSWORD }}
          RIDER_ANDROID_CERT_SHA256: ${{ secrets.RIDER_ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          printf '%s' "$RIDER_ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/rider-release.jks
          chmod 600 android/app/rider-release.jks
          keytool -exportcert -alias "$RIDER_ANDROID_KEY_ALIAS" -keystore android/app/rider-release.jks -storepass "$RIDER_ANDROID_KEYSTORE_PASSWORD" -file /tmp/rider-cert.der
          actual="$(sha256sum /tmp/rider-cert.der | cut -d' ' -f1)"
          expected="$(printf '%s' "$RIDER_ANDROID_CERT_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test "$actual" = "$expected" || { echo "::error::Rider signing certificate mismatch"; exit 1; }
          # Exporting the certificate only validates the store password; signing
          # additionally requires decrypting the alias's private key.
          if ! keytool -certreq -alias "$RIDER_ANDROID_KEY_ALIAS" \
            -keystore android/app/rider-release.jks \
            -storepass "$RIDER_ANDROID_KEYSTORE_PASSWORD" \
            -keypass "$RIDER_ANDROID_KEYSTORE_PASSWORD" \
            -file /tmp/rider-signing-check.csr >/dev/null 2>&1; then
            echo "::error::Cannot decrypt Rider signing private key. Verify RIDER_ANDROID_KEY_PASSWORD against the existing keystore and alias (PKCS12 stores often require the store password for both)."
            exit 1
          fi
          rm -f /tmp/rider-signing-check.csr /tmp/rider-cert.der
          cat >> android/app/build.gradle <<'GRADLE'
          android {
            signingConfigs {
              riderPermanent {
                storeFile file("rider-release.jks")
                storePassword System.getenv("RIDER_ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("RIDER_ANDROID_KEY_ALIAS")
                keyPassword System.getenv("RIDER_ANDROID_KEYSTORE_PASSWORD")
              }
            }
            buildTypes {
              release { signingConfig signingConfigs.riderPermanent }
            }
          }
          GRADLE
          cd android
          chmod +x gradlew
          ./gradlew :app:signingReport --no-daemon
          ./gradlew assembleRelease --no-daemon
          test -s app/build/outputs/apk/release/app-release.apk
      - name: Verify signed package
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt" dump badging "$APK" | head -3
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt" dump badging "$APK" | grep -q "package: name='com.britiumexpress.rider'"
      - name: Publish verified Rider APK to public downloads
        env:
          RIDER_ANDROID_CERT_SHA256: ${{ secrets.RIDER_ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          ACTUAL="$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^.*certificate SHA-256 digest: //p' | head -n 1 | tr '[:lower:]' '[:upper:]' | tr -d ':[:space:]')"
          EXPECTED="$(printf '%s' "$RIDER_ANDROID_CERT_SHA256" | tr '[:lower:]' '[:upper:]' | tr -d ':[:space:]')"
          if [ -z "$ACTUAL" ] || [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Refusing to publish APK: permanent signing certificate mismatch"
            exit 1
          fi
          VERSION_CODE="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | sed -n "s/.*versionCode='\\([0-9]*\\)'.*/\\1/p" | head -n 1)"
          test -n "$VERSION_CODE"
          test "$VERSION_CODE" -eq "$((400000 + GITHUB_RUN_NUMBER))"
          mkdir -p public/downloads
          cp "$APK" public/downloads/Britium-Express-Rider.apk
          cp "$APK" "public/downloads/Britium-Express-Rider-Build${GITHUB_RUN_NUMBER}.apk"
          printf '{"build":%s,"version":"1.0","versionCode":%s,"apk":"/downloads/Britium-Express-Rider-Build%s.apk","publishedAt":"%s"}\\n' "$GITHUB_RUN_NUMBER" "$VERSION_CODE" "$GITHUB_RUN_NUMBER" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > public/rider-release.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f public/downloads/Britium-Express-Rider.apk "public/downloads/Britium-Express-Rider-Build${GITHUB_RUN_NUMBER}.apk" public/rider-release.json
          git commit -m "build: publish verified Rider APK build ${GITHUB_RUN_NUMBER}"
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        with:
          name: britium-rider-signed-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

