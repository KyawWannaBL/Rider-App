name: Build Rider Android Release

on:
  push:
    branches: [main]
    paths:
      - "capacitor.config.ts"
      - ".github/workflows/build-rider-apk.yml"
      - "scripts/verify-android-release-signing.mjs"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rider-android-release
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify release-signing workflow policy
        run: node scripts/verify-android-release-signing.mjs

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Require permanent Rider signing secrets
        env:
          RIDER_ANDROID_KEYSTORE_BASE64: ${{ secrets.RIDER_ANDROID_KEYSTORE_BASE64 }}
          RIDER_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.RIDER_ANDROID_KEYSTORE_PASSWORD }}
          RIDER_ANDROID_KEY_ALIAS: ${{ secrets.RIDER_ANDROID_KEY_ALIAS }}
          RIDER_ANDROID_KEY_PASSWORD: ${{ secrets.RIDER_ANDROID_KEY_PASSWORD }}
          RIDER_ANDROID_CERT_SHA256: ${{ secrets.RIDER_ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          for name in \
            RIDER_ANDROID_KEYSTORE_BASE64 \
            RIDER_ANDROID_KEYSTORE_PASSWORD \
            RIDER_ANDROID_KEY_ALIAS \
            RIDER_ANDROID_KEY_PASSWORD \
            RIDER_ANDROID_CERT_SHA256
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required GitHub Actions secret: ${name}"
              exit 1
            fi
          done

      - name: Install project dependencies
        run: npm ci

      - name: Install Capacitor Android tooling
        run: npm install --no-save @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/assets

      - name: Prepare shell web directory
        run: |
          mkdir -p dist
          cat > dist/index.html <<'HTML'
          <!doctype html>
          <html>
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width,initial-scale=1">
              <title>Britium Express Rider</title>
            </head>
            <body style="font-family:Arial,sans-serif;background:#07111f;color:white;display:grid;place-items:center;min-height:100vh;margin:0">
              <div style="text-align:center"><h1>BRITIUM RIDER</h1><p>Starting secure Rider workspace...</p></div>
            </body>
          </html>
          HTML

          cat > dist/offline.html <<'HTML'
          <!doctype html>
          <html lang="my">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
              <meta name="theme-color" content="#07111f">
              <title>Britium Rider Connection</title>
              <style>
                *{box-sizing:border-box}
                body{margin:0;min-height:100vh;background:radial-gradient(circle at 80% 10%,rgba(34,211,238,.14),transparent 32rem),#07111f;color:#f8fafc;font-family:Arial,sans-serif;padding:24px;display:grid;place-items:center}
                .card{width:min(100%,460px);border:1px solid rgba(255,255,255,.12);border-radius:28px;padding:28px;background:rgba(15,23,42,.92);box-shadow:0 30px 80px rgba(0,0,0,.35)}
                .brand{font-size:12px;font-weight:900;letter-spacing:.22em;color:#67e8f9}
                h1{font-size:26px;margin:10px 0 12px}
                p{color:#cbd5e1;line-height:1.7;font-weight:600}
                .note{margin-top:14px;padding:14px;border-radius:18px;background:rgba(245,158,11,.10);color:#fde68a;font-size:14px}
                button,a{display:flex;width:100%;min-height:52px;align-items:center;justify-content:center;border-radius:18px;margin-top:12px;font-weight:900;text-decoration:none;border:0}
                button{background:linear-gradient(90deg,#d4af37,#f4d66d);color:#0f172a}
                a{border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:white}
                .small{margin-top:16px;font-size:12px;color:#94a3b8}
              </style>
            </head>
            <body>
              <main class="card">
                <div class="brand">BRITIUM EXPRESS</div>
                <h1>Rider App ကို ဖွင့်၍မရသေးပါ</h1>
                <p>အင်တာနက်ချိတ်ဆက်မှု သို့မဟုတ် Android System WebView ကို စစ်ဆေးပြီး ပြန်စမ်းပါ။</p>
                <div class="note">Tablet တွင် အဖြူရောင်မျက်နှာပြင်သာပေါ်ပါက Google Play Store မှ Android System WebView နှင့် Google Chrome ကို Update လုပ်ပါ။</div>
                <button onclick="location.href='https://www.britiumexpress.app/#/login'">ပြန်လည်ချိတ်ဆက်ရန်</button>
                <a href="https://www.britiumexpress.app/#/login">Browser ဖြင့် ဖွင့်ရန်</a>
                <div class="small">Your Rider account and operational data are not changed by this connection error.</div>
              </main>
            </body>
          </html>
          HTML

      - name: Generate Android project
        run: npx cap add android

      - name: Generate Android launcher icon from public logo
        run: |
          set -euo pipefail
          test -s public/logo.png
          rm -rf assets
          mkdir -p assets
          cp public/logo.png assets/logo.png
          npx @capacitor/assets generate --android \
            --assetPath assets \
            --iconBackgroundColor '#07111f' \
            --iconBackgroundColorDark '#07111f' \
            --splashBackgroundColor '#07111f' \
            --splashBackgroundColorDark '#07111f'
          test -s android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Configure Android permissions and monotonic version
        env:
          RIDER_VERSION_CODE: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          permissions = [
              "android.permission.INTERNET",
              "android.permission.CAMERA",
              "android.permission.ACCESS_FINE_LOCATION",
              "android.permission.ACCESS_COARSE_LOCATION",
          ]
          marker = "<application"
          additions = ""
          for permission in permissions:
              token = f'android:name="{permission}"'
              if token not in text:
                  additions += f'    <uses-permission android:name="{permission}" />\n'
          text = text.replace(marker, additions + marker, 1)
          manifest.write_text(text)

          run_number = int(os.environ["RIDER_VERSION_CODE"])
          version_code = 100000 + run_number
          version_name = f"1.0.{run_number}"
          gradle = Path("android/app/build.gradle")
          source = gradle.read_text()
          source, count_code = re.subn(r"versionCode\s+\d+", f"versionCode {version_code}", source, count=1)
          source, count_name = re.subn(r'versionName\s+"[^"]+"', f'versionName "{version_name}"', source, count=1)
          if count_code != 1 or count_name != 1:
              raise SystemExit("Could not set Android versionCode/versionName")
          gradle.write_text(source)
          print(f"Android versionCode={version_code}, versionName={version_name}")
          PY

      - name: Restore permanent Britium release keystore
        env:
          RIDER_ANDROID_KEYSTORE_BASE64: ${{ secrets.RIDER_ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$RIDER_ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/britium-rider-release.jks
          test -s android/app/britium-rider-release.jks
          chmod 600 android/app/britium-rider-release.jks

      - name: Configure permanent release signing
        run: |
          cat >> android/app/build.gradle <<'GRADLE'

          // Britium Express Rider permanent release signing.
          // Credentials are supplied only through GitHub Actions secrets.
          android {
              signingConfigs {
                  britiumRelease {
                      storeFile file(System.getenv("RIDER_ANDROID_KEYSTORE_PATH"))
                      storePassword System.getenv("RIDER_ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("RIDER_ANDROID_KEY_ALIAS")
                      // The generated permanent keystore is PKCS12, which uses the store password for the private key entry.
                      // RIDER_ANDROID_KEY_PASSWORD remains a required legacy secret but is intentionally not used for signing.
                      keyPassword System.getenv("RIDER_ANDROID_KEYSTORE_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.britiumRelease
                  }
              }
          }
          GRADLE

      - name: Build signed release APK and Play AAB
        working-directory: android
        env:
          RIDER_ANDROID_KEYSTORE_PATH: britium-rider-release.jks
          RIDER_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.RIDER_ANDROID_KEYSTORE_PASSWORD }}
          RIDER_ANDROID_KEY_ALIAS: ${{ secrets.RIDER_ANDROID_KEY_ALIAS }}
          RIDER_ANDROID_KEY_PASSWORD: ${{ secrets.RIDER_ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Verify release certificate is permanent
        env:
          RIDER_ANDROID_CERT_SHA256: ${{ secrets.RIDER_ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee rider-signing-info.txt
          ACTUAL="$($APKSIGNER verify --print-certs "$APK" | sed -n 's/^.*certificate SHA-256 digest: //p' | head -n 1 | tr '[:lower:]' '[:upper:]' | tr -d ':[:space:]')"
          EXPECTED="$(printf '%s' "$RIDER_ANDROID_CERT_SHA256" | tr '[:lower:]' '[:upper:]' | tr -d ':[:space:]')"
          if [ -z "$ACTUAL" ] || [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Rider APK signing certificate does not match the pinned permanent certificate."
            echo "Actual SHA-256: $ACTUAL"
            exit 1
          fi
          echo "Permanent Rider signing certificate verified: $ACTUAL"

      - name: Prepare distributable files
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Britium-Express-Rider.apk
          cp android/app/build/outputs/bundle/release/app-release.aab Britium-Express-Rider.aab
          sha256sum Britium-Express-Rider.apk Britium-Express-Rider.aab > rider-release-sha256.txt

      - name: Publish signed APK into Rider App public downloads
        run: |
          mkdir -p public/downloads
          cp Britium-Express-Rider.apk public/downloads/Britium-Express-Rider.apk

      - name: Commit signed public APK
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/downloads/Britium-Express-Rider.apk
          if git diff --cached --quiet; then
            echo "Signed APK unchanged; no repository commit needed."
          else
            git commit -m "build: publish signed Rider Android release"
            git push origin HEAD:main
          fi

      - name: Upload signed Rider release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Britium-Express-Rider-Android-Release
          path: |
            Britium-Express-Rider.apk
            Britium-Express-Rider.aab
            rider-signing-info.txt
            rider-release-sha256.txt
          retention-days: 30
