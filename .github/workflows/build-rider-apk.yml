name: Build Rider Android Release

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "index.html"
      - "vite.config.ts"
      - "package.json"
      - "package-lock.json"
      - "tailwind.config.cjs"
      - "postcss.config.cjs"
      - "capacitor.config.ts"
      - "android-assets/rider-app-icon.png"
      - "public/logo.png"
      - "public/images/**"
      - ".github/workflows/build-rider-apk.yml"
      - "scripts/verify-android-release-signing.mjs"
      - "scripts/verify-ui-css.mjs"
      - "scripts/verify-enterprise-integration.mjs"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rider-android-release
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify release-signing workflow policy
        run: node scripts/verify-android-release-signing.mjs

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Require permanent Rider signing secrets
        env:
          RIDER_ANDROID_KEYSTORE_BASE64: ${{ secrets.RIDER_ANDROID_KEYSTORE_BASE64 }}
          RIDER_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.RIDER_ANDROID_KEYSTORE_PASSWORD }}
          RIDER_ANDROID_KEY_ALIAS: ${{ secrets.RIDER_ANDROID_KEY_ALIAS }}
          RIDER_ANDROID_KEY_PASSWORD: ${{ secrets.RIDER_ANDROID_KEY_PASSWORD }}
          RIDER_ANDROID_CERT_SHA256: ${{ secrets.RIDER_ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          for name in \
            RIDER_ANDROID_KEYSTORE_BASE64 \
            RIDER_ANDROID_KEYSTORE_PASSWORD \
            RIDER_ANDROID_KEY_ALIAS \
            RIDER_ANDROID_KEY_PASSWORD \
            RIDER_ANDROID_CERT_SHA256
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required GitHub Actions secret: ${name}"
              exit 1
            fi
          done

      - name: Install project dependencies
        run: npm install --no-audit --no-fund

      - name: Install Capacitor Android tooling
        run: npm install --no-save @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/camera@7 @capacitor/app@7 @capacitor/assets sharp

      - name: Build packaged Rider web application
        run: |
          set -euo pipefail
          npm run build
          # Never package the previous downloadable APK/AAB inside the new APK.
          # Vite copies public/** into dist/**; keeping dist/downloads would recursively
          # embed the prior APK and can push the signed release over GitHub's 100 MB limit.
          rm -rf dist/downloads
          test -s dist/index.html
          test -d dist/assets
          echo "Rider web application packaged locally for Android WebView without nested release binaries."

      - name: Generate Android project
        run: npx cap add android

      - name: Generate exact user-supplied green Rider launcher icon
        run: |
          set -euo pipefail
          rm -rf assets
          mkdir -p assets

          # Use the exact green Rider artwork supplied by Phoe Chan in ChatGPT.
          # Do not recolor, redraw, crop, trim, or substitute another logo.
          curl -fsSL --retry 3 \
            "https://cdn.creativeclaw.co/u/1e27c35b/images/5a80e573-717f-4824-852c-11e2f7daa23e.png" \
            -o assets/logo.png
          test -s assets/logo.png

          EXPECTED_ICON_SHA256="6cbdb4e5a12f2beaa7f657e09cb494f6af8e0e10e1cda043fb371c014ed12dbb"
          ACTUAL_ICON_SHA256="$(sha256sum assets/logo.png | awk '{print $1}')"
          if [ "$ACTUAL_ICON_SHA256" != "$EXPECTED_ICON_SHA256" ]; then
            echo "::error::Rider launcher source does not match the exact attached green image."
            echo "Expected: $EXPECTED_ICON_SHA256"
            echo "Actual:   $ACTUAL_ICON_SHA256"
            exit 1
          fi
          echo "Exact Rider icon source verified: $ACTUAL_ICON_SHA256"

          npx @capacitor/assets generate --android \
            --assetPath assets \
            --iconBackgroundColor '#00C853' \
            --iconBackgroundColorDark '#00A844' \
            --splashBackgroundColor '#07111f' \
            --splashBackgroundColorDark '#07111f'

          # Force every legacy launcher density to use the same green-backed
          # Rider artwork, including round icons. This is the path Android 8
          # launchers use after adaptive icon resources are removed.
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const sharp = require('sharp');

          (async () => {
            const root = 'android/app/src/main/res';
            const src = 'assets/logo.png';
            for (const dir of fs.readdirSync(root).filter((name) => /^mipmap-(mdpi|hdpi|xhdpi|xxhdpi|xxxhdpi)$/.test(name))) {
              const full = path.join(root, dir);
              const target = path.join(full, 'ic_launcher.png');
              if (!fs.existsSync(target)) continue;
              const meta = await sharp(target).metadata();
              const width = meta.width || 192;
              const height = meta.height || width;
              const buffer = await sharp(src)
                .resize(width, height, { fit: 'cover' })
                .png({ palette: false, compressionLevel: 9 })
                .toBuffer();
              fs.writeFileSync(target, buffer);
              fs.writeFileSync(path.join(full, 'ic_launcher_round.png'), buffer);
            }
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

          test -s android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          test -s android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png

      - name: Normalize generated launcher PNGs for Android AAPT
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const sharp = require('sharp');
          (async () => {
            const root = 'android/app/src/main/res';
            for (const dir of fs.readdirSync(root).filter((name) => name.startsWith('mipmap-'))) {
              const full = path.join(root, dir);
              if (!fs.statSync(full).isDirectory()) continue;
              for (const file of fs.readdirSync(full).filter((name) => /^ic_launcher.*\\.png$/.test(name))) {
                const src = path.join(full, file);
                const tmp = src + '.truecolor.png';
                await sharp(src).toColourspace('srgb').png({ palette: false, compressionLevel: 9 }).toFile(tmp);
                fs.renameSync(tmp, src);
              }
            }
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE

      - name: Use Android 8 compatible full launcher icon
        run: |
          set -euo pipefail
          find android/app/src/main/res -type f -name 'ic_launcher_foreground.png' -delete
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          test -s android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          echo "Using full legacy launcher PNGs; Android 8 will render the supplied artwork without adaptive foreground corruption."

      - name: Configure Android permissions and monotonic version
        env:
          RIDER_VERSION_CODE: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          permissions = [
              ("android.permission.INTERNET", None),
              ("android.permission.CAMERA", None),
              ("android.permission.ACCESS_FINE_LOCATION", None),
              ("android.permission.ACCESS_COARSE_LOCATION", None),
              ("android.permission.READ_MEDIA_IMAGES", None),
              ("android.permission.READ_EXTERNAL_STORAGE", 'android:maxSdkVersion="32"'),
          ]
          marker = "<application"
          additions = ""
          for permission, extra in permissions:
              token = f'android:name="{permission}"'
              if token not in text:
                  suffix = f" {extra}" if extra else ""
                  additions += f'    <uses-permission android:name="{permission}"{suffix} />\n'
          text = text.replace(marker, additions + marker, 1)
          manifest.write_text(text)

          run_number = int(os.environ["RIDER_VERSION_CODE"])
          version_code = 100000 + run_number
          version_name = f"1.0.{run_number}"
          gradle = Path("android/app/build.gradle")
          source = gradle.read_text()
          source, count_code = re.subn(r"versionCode\s+\d+", f"versionCode {version_code}", source, count=1)
          source, count_name = re.subn(r'versionName\s+"[^"]+"', f'versionName "{version_name}"', source, count=1)
          if count_code != 1 or count_name != 1:
              raise SystemExit("Could not set Android versionCode/versionName")
          gradle.write_text(source)
          print(f"Android versionCode={version_code}, versionName={version_name}")
          PY

      - name: Restore permanent Britium release keystore
        env:
          RIDER_ANDROID_KEYSTORE_BASE64: ${{ secrets.RIDER_ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$RIDER_ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/britium-rider-release.jks
          test -s android/app/britium-rider-release.jks
          chmod 600 android/app/britium-rider-release.jks

      - name: Configure permanent release signing
        run: |
          cat >> android/app/build.gradle <<'GRADLE'

          // Britium Express Rider permanent release signing.
          // Credentials are supplied only through GitHub Actions secrets.
          android {
              signingConfigs {
                  britiumRelease {
                      storeFile file(System.getenv("RIDER_ANDROID_KEYSTORE_PATH"))
                      storePassword System.getenv("RIDER_ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("RIDER_ANDROID_KEY_ALIAS")
                      // The generated permanent keystore is PKCS12, which uses the store password for the private key entry.
                      // RIDER_ANDROID_KEY_PASSWORD remains a required legacy secret but is intentionally not used for signing.
                      keyPassword System.getenv("RIDER_ANDROID_KEYSTORE_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.britiumRelease
                  }
              }
          }
          GRADLE

      - name: Build signed release APK and Play AAB
        working-directory: android
        env:
          RIDER_ANDROID_KEYSTORE_PATH: britium-rider-release.jks
          RIDER_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.RIDER_ANDROID_KEYSTORE_PASSWORD }}
          RIDER_ANDROID_KEY_ALIAS: ${{ secrets.RIDER_ANDROID_KEY_ALIAS }}
          RIDER_ANDROID_KEY_PASSWORD: ${{ secrets.RIDER_ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Verify release certificate is permanent
        env:
          RIDER_ANDROID_CERT_SHA256: ${{ secrets.RIDER_ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee rider-signing-info.txt
          ACTUAL="$($APKSIGNER verify --print-certs "$APK" | sed -n 's/^.*certificate SHA-256 digest: //p' | head -n 1 | tr '[:lower:]' '[:upper:]' | tr -d ':[:space:]')"
          EXPECTED="$(printf '%s' "$RIDER_ANDROID_CERT_SHA256" | tr '[:lower:]' '[:upper:]' | tr -d ':[:space:]')"
          if [ -z "$ACTUAL" ] || [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Rider APK signing certificate does not match the pinned permanent certificate."
            echo "Actual SHA-256: $ACTUAL"
            exit 1
          fi
          echo "Permanent Rider signing certificate verified: $ACTUAL"

      - name: Prepare distributable files
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Britium-Express-Rider.apk
          cp android/app/build/outputs/bundle/release/app-release.aab Britium-Express-Rider.aab
          sha256sum Britium-Express-Rider.apk Britium-Express-Rider.aab > rider-release-sha256.txt

      - name: Publish signed APK into Rider App public downloads
        run: |
          mkdir -p public/downloads
          cp Britium-Express-Rider.apk public/downloads/Britium-Express-Rider.apk
          cp Britium-Express-Rider.apk "public/downloads/Britium-Express-Rider-Build${GITHUB_RUN_NUMBER}.apk"
          cat > public/rider-release.json <<EOF
          {
            "build": ${GITHUB_RUN_NUMBER},
            "version": "1.0.${GITHUB_RUN_NUMBER}",
            "versionCode": $((100000 + GITHUB_RUN_NUMBER)),
            "apk": "/downloads/Britium-Express-Rider-Build${GITHUB_RUN_NUMBER}.apk",
            "publishedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Commit signed public APK
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f public/downloads/Britium-Express-Rider.apk "public/downloads/Britium-Express-Rider-Build${GITHUB_RUN_NUMBER}.apk" public/rider-release.json
          if git diff --cached --quiet; then
            echo "Signed APK unchanged; no repository commit needed."
          else
            git commit -m "build: publish signed Rider Android release"
            git push origin HEAD:main
          fi

      - name: Upload signed Rider release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Britium-Express-Rider-Android-Release
          path: |
            Britium-Express-Rider.apk
            Britium-Express-Rider.aab
            rider-signing-info.txt
            rider-release-sha256.txt
          retention-days: 30
